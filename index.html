<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acompanhamento das Alunas</title>
<meta name="robots" content="noindex, nofollow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap">
<link rel="stylesheet" href="assets/css/painel.css">
</head>
<body>
<a class="pular" href="#conteudo">Pular para o conteúdo</a>
<header class="topo">
  <button type="button" class="menu-btn" id="menu-btn" data-acao="menu" aria-expanded="false" aria-controls="nav"><span aria-hidden="true">☰</span> <span class="menu-atual">Menu</span></button>
  <div class="marca">
    <span class="marca-titulo">Acompanhamento das Alunas</span>
    <span class="marca-sub" id="status-dados" aria-live="polite"></span>
  </div>
  <div class="topo-controles">
    <button type="button" class="btn btn-sec btn-peq" data-acao="atualizar" title="Mostra até quando vão os dados, recalcula as análises e leva para importar o arquivo mais novo">Atualizar dados</button>
    <div class="seg" role="group" aria-label="Fonte dos dados">
      <button type="button" data-acao="modo" data-v="demo" aria-pressed="true">Exemplo fictício</button>
      <button type="button" data-acao="modo" data-v="import" aria-pressed="false">Importados</button>
    </div>
    <label class="papel"><span>Ver como</span>
      <select id="papel" data-mudar="papel">
        <option value="leitura">Leitura</option>
        <option value="edicao">Edição</option>
        <option value="exportacao">Exportação</option>
        <option value="admin" selected>Administração</option>
      </select>
    </label>
  </div>
</header>
<div id="faixa" class="faixa faixa-demo" role="note"></div>
<div class="casca">
  <nav id="nav" class="nav" aria-label="Seções do painel"></nav>
  <main id="conteudo" class="principal" tabindex="-1">
    <div id="filtros"></div>
    <div id="aba"></div>
  </main>
</div>
<div id="modal" class="modal" hidden></div>
<div id="aviso" class="aviso" role="status" aria-live="polite" hidden></div>
<noscript><p class="faixa">Este painel precisa de JavaScript ativado no navegador.</p></noscript>
<!-- JSZip 3.10.1 (licença MIT): gera o .zip do pacote de prints, inclusive sem internet. -->
<script src="assets/vendor/jszip-3.10.1.min.js"></script>
<script src="assets/js/util.js"></script>
<script src="assets/js/classificador.js"></script>
<script src="assets/js/privacidade.js"></script>
<script src="assets/js/importadores.js"></script>
<script src="assets/js/prints.js"></script>
<script src="assets/js/dados-demo.js"></script>
<script src="assets/js/grafico.js"></script>
<script src="assets/js/pauta.js"></script>
<script src="assets/js/analise.js"></script>
<script src="assets/js/app.js"></script>
</body>
</html>
